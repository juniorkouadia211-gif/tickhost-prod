services:
  - type: web
    name: tickhost
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.10.0
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: CINETPAY_API_SECRET
        value: your-cinetpay-secret-here
      - key: ALLOWED_ORIGINS
        value: ""
      - key: BASE_URL
        value: "https://tickhost.onrender.com"
