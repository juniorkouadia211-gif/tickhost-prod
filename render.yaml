services:
  - type: web
    name: tickhost
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/ticketing.db
      - key: UPLOADS_PATH
        value: /data/uploads
    disk:
      name: tickhost-storage
      mountPath: /data
      sizeGB: 1
