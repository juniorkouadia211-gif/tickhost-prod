services:
  - type: web
    name: tickhost
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.10.0 # On utilise une version stable
      - key: DATABASE_URL
        value: sqlite://ticketing.db
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
